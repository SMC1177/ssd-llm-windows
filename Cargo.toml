[workspace]
resolver = "2"
members = [
    "crates/ssd-llm",
    "crates/ssd-index",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/SMC1177/ssd-llm-windows"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
memmap2 = "0.9"
half = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
